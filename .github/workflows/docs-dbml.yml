# El modelo de datos publicado tiene que coincidir con el esquema.
#
# ── Por qué existe ────────────────────────────────────────────────────────────────────────
# `docs/02-dominio-datos/consolidado.dbml` decía en su cabecera "generado por introspección de
# information_schema"... pero NO había ningún generador en el repositorio. Se generó una vez, en
# julio de 2026, y desde entonces se mantuvo a mano. Resultado medido el 2026-08-11: tres columnas
# de deriva, y DOS de ellas introducidas el día anterior por el frente 0.8. El diagrama se
# desactualiza al ritmo al que se mueve el esquema, que es todos los días.
#
# Esta puerta lo impide: regenera y compara. Si alguien toca `postgres_schema.sql` sin regenerar,
# esto se pone rojo con el comando exacto que hay que ejecutar.
#
# ── Efecto secundario que vale tanto como la puerta ───────────────────────────────────────
# Para generar hay que APLICAR el esquema a un PostgreSQL de verdad, con ON_ERROR_STOP=1. Es la
# primera vez que algo valida `postgres_schema.sql`: `node --check` no mira SQL, `check:imports`
# tampoco, y el backend arranca igual porque para él es una cadena de texto. Así sobrevivieron
# meses cuatro `UPDATE ... INNER JOIN ... SET` de sintaxis MySQL que PostgreSQL rechaza.
name: docs-dbml

on:
  pull_request:
    paths:
      - 'backend/database/postgres_schema.sql'
      - 'docs/02-dominio-datos/**'
      - 'docs/public/diagramas/**'
      - 'docs/src/content/docs/complemento/mapa-*.md'
      - 'docs/src/content/docs/modelo/mapa-*.md'
      - 'docs/src/content/docs/referencia/modelo-datos.md'
      - 'docs/src/content/docs/referencia/campos-proceso-documento.md'
      - 'backend/scripts/docs/gen-campos-md.mjs'
      - 'scripts/docs/**'
      - '.github/workflows/docs-dbml.yml'
  push:
    branches: [develop, main]
    paths:
      - 'backend/database/postgres_schema.sql'
      - 'docs/02-dominio-datos/**'
      - 'docs/public/diagramas/**'
      - 'docs/src/content/docs/complemento/mapa-*.md'
      - 'docs/src/content/docs/modelo/mapa-*.md'
      - 'docs/src/content/docs/referencia/modelo-datos.md'
      - 'docs/src/content/docs/referencia/campos-proceso-documento.md'
      - 'backend/scripts/docs/gen-campos-md.mjs'
      - 'scripts/docs/**'
      - '.github/workflows/docs-dbml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modelo-al-dia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El script se levanta su propio PostgreSQL con `docker run`, así que aquí no hace falta
      # ningún `services:`. Es a propósito: el generador tiene que funcionar igual en la máquina
      # de quien desarrolla que en el runner, sin depender de una pila de dev.
      # Antes de regenerar: que el mapa cuadre. Si una tabla no tiene módulo, el post-procesado
      # falla igual, pero con un mensaje peor; y la regla de las capas no la mira nadie más.
      - name: Comprobar el mapa de módulos
        run: node scripts/docs/check-mapa-tablas.mjs

      - name: Regenerar el modelo y comprobar que no hay deriva
        run: bash scripts/docs/gen-dbml.sh --check

  # ── Bloqueante: la referencia de CAMPOS, que no tenia puerta ─────────────────────────────
  #
  # POR QUE EXISTE. `docs/src/content/docs/referencia/campos-proceso-documento.md` es un
  # ARTEFACTO: lo escribe `backend/scripts/docs/gen-campos-md.mjs` desde el catalogo de
  # PostgreSQL. Era el UNICO generador de pagina sin comprobacion en CI, y se rompio en
  # silencio el 2026-10-04: al repartir las tablas en esquemas por tema, su consulta filtraba
  # `information_schema.columns` por `table_schema = 'public'` y dejo de encontrar nada. Sus
  # otras dos consultas resuelven por `regclass` --o sea por `search_path`-- y seguian
  # funcionando, asi que el generador no fallaba: emitia la pagina con sus 101 vinculos y CERO
  # columnas. La pagina commiteada seguia bien SOLO porque nadie la habia regenerado. Quien lo
  # hubiera hecho la habria vaciado, y el diff habria parecido intencionado.
  #
  # Se descubrio tres commits despues, y por casualidad. Esta puerta es lo que lo habria dicho
  # el mismo dia.
  #
  # POR QUE UN POSTGRESQL DE SERVICIO Y NO LA PILA DE DOCKER. La pagina se deriva del ESQUEMA y
  # de nada mas: no necesita ni una fila sembrada. Con aplicar `postgres_schema.sql` a una base
  # vacia basta, y asi la comprobacion no depende de que haya una pila levantada --que en un
  # runner no la hay-- ni de datos, que la harian fragil.
  #
  # POR QUE NO SE PLEGO DENTRO DE `gen-dbml.sh`, que ya levanta su propio PostgreSQL: el
  # generador importa el pool del backend (`config/postgres.js`), asi que necesita las
  # dependencias de `backend/`, y los contenedores efimeros de ese script no las tienen. Que
  # dependa del pool y no de `psql` es lo que mantiene UNA sola forma de hablar con la base en
  # todo el repositorio, y no vale la pena romperla por un paso de CI.
  campos-al-dia:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: camposgen
          POSTGRES_DB: deasy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      # ON_ERROR_STOP=1: si el esquema no aplica, este paso falla aqui y no mas adelante con un
      # error raro. Es la misma validacion que hace `gen-dbml.sh`.
      - name: Aplicar el esquema a una base vacia
        env:
          PGPASSWORD: camposgen
        run: psql -h localhost -U postgres -d deasy -v ON_ERROR_STOP=1 -q -f backend/database/postgres_schema.sql

      - name: Comprobar que la referencia de campos coincide con el esquema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: camposgen
          POSTGRES_DB: deasy
        working-directory: backend
        run: |
          node scripts/docs/gen-campos-md.mjs > /tmp/campos.md
          if ! diff -u ../docs/src/content/docs/referencia/campos-proceso-documento.md /tmp/campos.md; then
            echo "" >&2
            echo "✖ La referencia de campos no coincide con el esquema. Regenerala:" >&2
            echo "    bash scripts/docs/gen-campos.sh <pila>" >&2
            exit 1
          fi
          echo "✓ La referencia de campos coincide con el esquema."

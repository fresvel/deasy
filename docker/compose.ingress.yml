name: deasy-ingress

services:
  nginx-ingress:
    image: nginx:1.28-alpine
    container_name: deasy-public-ingress
    restart: unless-stopped
    environment:
      PROD_SERVER_NAMES: ${PROD_SERVER_NAMES}
      QA_SERVER_NAME: ${QA_SERVER_NAME}
      PROD_FRONTEND_UPSTREAM: ${PROD_FRONTEND_UPSTREAM}
      PROD_BACKEND_UPSTREAM: ${PROD_BACKEND_UPSTREAM}
      QA_FRONTEND_UPSTREAM: ${QA_FRONTEND_UPSTREAM}
      QA_BACKEND_UPSTREAM: ${QA_BACKEND_UPSTREAM}
      TLS_CERT_PATH: /etc/nginx/certs/${NGINX_TLS_CERT_DIR}/fullchain.pem
      TLS_KEY_PATH: /etc/nginx/certs/${NGINX_TLS_CERT_DIR}/privkey.pem
      CERT_WATCH_SECONDS: ${CERT_WATCH_SECONDS:-300}
    ports:
      - "${PROXY_HTTP_PORT}:80"
      - "${PROXY_HTTPS_PORT}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ingress-conf.d:/etc/nginx/templates:ro
      # nginx se recarga solo cuando cambia su certificado: ver el propio script.
      - ../nginx/scripts/40-recargar-si-cambia-el-certificado.sh:/docker-entrypoint.d/40-recargar-si-cambia-el-certificado.sh:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      - ../nginx/acme:/var/www/certbot:ro
    networks:
      - public-ingress
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # RENUEVA EL CERTIFICADO PÚBLICO. Duerme junto a nginx y cada 12 horas pregunta a Let's Encrypt
  # si toca (sólo renueva cuando faltan menos de 30 días). El bucle y su porqué están en
  # `nginx/scripts/renew-loop.sh`.
  #
  # SÓLO ESCRIBE EL CERTIFICADO. No recarga nginx —nginx vigila su certificado y se recarga solo—,
  # no tiene el socket de Docker y no comparte procesos con nadie. Lo que sí tiene es la carpeta
  # de certificados en escritura —guarda la llave privada—, y por eso la imagen va fijada por
  # versión Y huella.
  #
  # No lleva red propia que publicar: sale a internet para hablar con Let's Encrypt y nada más.
  # Su estado de salud es el del certificado: «unhealthy» cuando le quedan menos de 15 días, que
  # es cuando ya debería haberse renovado y no lo hizo.
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d}
    container_name: deasy-public-certbot
    restart: unless-stopped
    environment:
      RENEW_INTERVAL_SECONDS: ${RENEW_INTERVAL_SECONDS:-43200}
      CERT_NAME: ${CERT_NAME:-}
    entrypoint: ["/bin/sh", "/renew-loop.sh"]
    volumes:
      - ../nginx/scripts/renew-loop.sh:/renew-loop.sh:ro
      - ../nginx/certs:/etc/letsencrypt:rw
      - ../nginx/acme:/var/www/certbot:rw
    healthcheck:
      test: ["CMD-SHELL", "openssl x509 -noout -checkend 1296000 -in /etc/letsencrypt/public/fullchain.pem >/dev/null 2>&1"]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 2m

networks:
  public-ingress:
    name: ${PUBLIC_INGRESS_NETWORK:-deasy_public_ingress}
    external: true

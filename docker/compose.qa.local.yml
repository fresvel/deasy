name: deasy-qa-local

services:
  nginx-proxy:
    ports:
      - "${PROXY_HTTP_PORT}:80"
      - "${PROXY_HTTPS_PORT}:443"

  mariadb:
    ports:
      - "13306:3306"

  mongodb:
    ports:
      - "12717:27017"

  rabbitmq:
    ports:
      - "15672:5672"
      - "15673:15672"

  emqx:
    ports:
      - "11883:1883"
      - "18084:18083"

  minio:
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    env_file:
      - .env.qa
    volumes:
      - ../backend:/app/backend
      - ../tools/templates:/app/tools/templates:ro
      - backend_node_modules_v2:/app/backend/node_modules
      - uploads_data:/app/backend/uploads
      - storage_data:/app/backend/storage

  storage-uploader:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    env_file:
      - .env.qa
    volumes:
      - ../backend:/app/backend
      - backend_node_modules_v2:/app/backend/node_modules
      - storage_data:/app/backend/storage

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
    env_file:
      - .env.qa
    volumes:
      - ../frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

  signer:
    build:
      context: ..
      dockerfile: docker/signer/Dockerfile
    env_file:
      - .env.qa
    ports:
      - "14000:4000"
    volumes:
      - ../signer:/app

  analytics:
    build:
      context: ..
      dockerfile: docker/analytics/Dockerfile

volumes:
  mariadb_data:
    name: deasy_qa_local_mariadb_data
  mongodb_data:
    name: deasy_qa_local_mongodb_data
  rabbitmq_data:
    name: deasy_qa_local_rabbitmq_data
  emqx_data:
    name: deasy_qa_local_emqx_data
  emqx_log:
    name: deasy_qa_local_emqx_log
  minio_data:
    name: deasy_qa_local_minio_data
  backend_node_modules_v2:
    name: deasy_qa_local_backend_node_modules
  frontend_node_modules:
    name: deasy_qa_local_frontend_node_modules
  uploads_data:
    name: deasy_qa_local_uploads_data
  storage_data:
    name: deasy_qa_local_storage_data

networks:
  default:
    name: deasy_qa_local_network

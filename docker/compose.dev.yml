name: deasy-dev

services:
  nginx-proxy:
    ports:
      - "${PROXY_HTTP_PORT}:80"
      - "${PROXY_HTTPS_PORT}:443"

  postgres:
    ports:
      - "5432:5432"

  rabbitmq:
    # Enlazado a 127.0.0.1 a proposito. Antes se publicaba en TODAS las interfaces, y con
    # `loopback_users.guest = false` + usuario guest administrador eso dejaba la UI de gestion
    # —que muestra el CUERPO de los mensajes, y ahi viaja `certPassword`— al alcance de la red.
    # En dev se conserva el acceso local por comodidad; en qa y prod no se publica nada.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  minio:
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    env_file:
      - .env.dev
    volumes:
      - ../backend:/app/backend
      - backend_node_modules_v2:/app/backend/node_modules

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
    env_file:
      - .env.dev
    volumes:
      - ../frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

  signer:
    build:
      context: ..
      dockerfile: docker/signer/Dockerfile
    env_file:
      - .env.dev
    ports:
      - "4000:4000"
    volumes:
      - ../signer:/app

  analytics:
    build:
      context: ..
      dockerfile: docker/analytics/Dockerfile

volumes:
  postgres_data:
    name: deasy_dev_postgres_data
  rabbitmq_data:
    name: deasy_dev_rabbitmq_data
  minio_data:
    name: deasy_dev_minio_data
  backend_node_modules_v2:
    name: deasy_dev_backend_node_modules
  frontend_node_modules:
    name: deasy_dev_frontend_node_modules

networks:
  default:
    name: deasy_dev_network

name: deasy-dev

services:
  nginx-proxy:
    ports:
      - "${PROXY_HTTP_PORT}:80"
      - "${PROXY_HTTPS_PORT}:443"

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  rabbitmq:
    # Enlazado a 127.0.0.1 a proposito. Antes se publicaba en TODAS las interfaces, y con
    # `loopback_users.guest = false` + usuario guest administrador eso dejaba la UI de gestion
    # —que muestra el CUERPO de los mensajes, y ahi viaja `certPassword`— al alcance de la red.
    # En dev se conserva el acceso local por comodidad; en qa y prod no se publica nada.
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"

  minio:
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    env_file:
      - .env.dev
    volumes:
      - ../backend:/app/backend
      - backend_node_modules_v2:/app/backend/node_modules

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
    env_file:
      - .env.dev
    volumes:
      - ../frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules

  # Solo en dev: en dev el sitio se SIRVE desde el codigo montado, con recarga en caliente,
  # asi que aqui no hay imagen que publicar. Vive en este overlay y no en `compose.base.yml`
  # a proposito, porque qa y prod aun no despliegan documentacion.
  #
  # Existia desde marzo en el `docker-compose.yml` monolitico y se perdio al partirlo en
  # base + overlays; el Dockerfile y `DOCS_PORT` sobrevivieron en los cuatro `.env`. No fue
  # una decision, fue un descuido: esto lo restituye.
  docs:
    build:
      context: ..
      dockerfile: docker/docs/Dockerfile
    env_file:
      - .env.dev
    ports:
      - "${DOCS_PORT:-4321}:4321"
    volumes:
      - ../docs:/app/docs
      # Sombrea el node_modules de la imagen, como en backend y frontend. Consecuencia:
      # una dependencia nueva se instala DENTRO del contenedor, no en el host.
      - docs_node_modules:/app/docs/node_modules

  # ── Explorador del modelo de datos (opcional) ─────────────────────────────────────────
  # Azimutt (MIT) sirve para EXPLORAR el esquema de forma interactiva: buscar una tabla,
  # abrir solo sus vecinas, seguir una relacion. Es lo que los diagramas estaticos por
  # dominio no pueden dar.
  #
  # Va detras del perfil `explorer` A PROPOSITO: son DOS contenedores mas (la aplicacion
  # necesita su propia base) y es una herramienta que se abre de vez en cuando, no parte
  # de la aplicacion. Con cuatro pilas, arrancarlo por defecto serian ocho contenedores
  # comiendo RAM sin que nadie los mire.
  #
  #   bash scripts/stack.sh c --profile explorer up -d azimutt
  #
  # Su base es PROPIA y no la del proyecto, tambien a proposito: `test:char:run` resetea
  # la base de dev, y con ella se llevaria por delante los diagramas guardados aqui.
  azimutt:
    image: ghcr.io/azimuttapp/azimutt:main
    profiles: [explorer]
    restart: unless-stopped
    depends_on:
      azimutt-db:
        condition: service_healthy
    environment:
      PHX_HOST: localhost
      PORT: "4000"
      # Secreto de DESARROLLO. Vale porque esta pila no se publica; para cualquier
      # despliegue real hay que generar uno propio (>= 64 bytes aleatorios).
      SECRET_KEY_BASE: ${AZIMUTT_SECRET_KEY_BASE}
      DATABASE_URL: postgresql://azimutt:azimutt@azimutt-db:5432/azimutt
      FILE_STORAGE_ADAPTER: local
      AUTH_PASSWORD: "true"
    ports:
      - "${AZIMUTT_PORT:-4700}:4000"

  azimutt-db:
    image: postgres:17
    profiles: [explorer]
    restart: unless-stopped
    environment:
      POSTGRES_USER: azimutt
      POSTGRES_PASSWORD: azimutt
      POSTGRES_DB: azimutt
    volumes:
      - azimutt_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azimutt -d azimutt"]
      interval: 5s
      timeout: 5s
      retries: 20

  signer:
    build:
      context: ..
      dockerfile: docker/signer/Dockerfile
    env_file:
      - .env.dev
    ports:
      - "${SIGNER_PORT:-4000}:4000"
    volumes:
      - ../signer:/app

  analytics:
    build:
      context: ..
      dockerfile: docker/analytics/Dockerfile

# Los nombres llevan el ESPACIO DE NOMBRES de la pila (`DEASY_STACK`), que por defecto es `dev`.
# Sin esa variable todo se comporta exactamente igual que siempre: `docker-env.sh dev` no se entera.
# Con ella, `scripts/stack.sh <a|b|c|d>` levanta pilas paralelas que NO comparten ni base, ni MinIO,
# ni node_modules, ni red. Compartirlos era el fallo: aunque cambies el nombre del proyecto, dos
# pilas con el MISMO volumen de postgres se pisan, y `test:char:run` resetea la base de la otra.
volumes:
  postgres_data:
    name: deasy_${DEASY_STACK:-dev}_postgres_data
  rabbitmq_data:
    name: deasy_${DEASY_STACK:-dev}_rabbitmq_data
  minio_data:
    name: deasy_${DEASY_STACK:-dev}_minio_data
  backend_node_modules_v2:
    name: deasy_${DEASY_STACK:-dev}_backend_node_modules
  frontend_node_modules:
    name: deasy_${DEASY_STACK:-dev}_frontend_node_modules
  docs_node_modules:
    name: deasy_${DEASY_STACK:-dev}_docs_node_modules
  azimutt_data:
    name: deasy_${DEASY_STACK:-dev}_azimutt_data

networks:
  default:
    name: deasy_${DEASY_STACK:-dev}_network

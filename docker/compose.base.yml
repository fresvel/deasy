services:
  # Único motor de datos (migración a PostgreSQL completa; MariaDB y Mongo retirados).
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      # OJO: RabbitMQ solo honra estas dos variables en el PRIMER arranque, con el volumen de
      # datos vacio. En un despliegue que ya existe hay que crear el usuario a mano una vez:
      # ver scripts/rabbitmq-migrar-usuario.sh
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # EL ALMACÉN ES VERSITY GATEWAY DESDE EL 2026-11-25 (frente 29), y el servicio se sigue llamando
  # `minio` a propósito: es el nombre que llevan el backend y el firmador en `MINIO_ENDPOINT`, y lo
  # que hablan con él es S3. Lo que corre es una pasarela S3 (Apache 2.0) sobre un directorio:
  #   /data/s3          los objetos, como ficheros corrientes (metadatos en xattrs `user.*`)
  #   /data/versioning  las versiones NO vigentes (sin esto no hay versionado ni Object Lock)
  # Los dos van en UN volumen a propósito: pasar una versión de un árbol a otro es un rename.
  #
  # ⚠️ EL BLOQUEO Y LAS VERSIONES VIVEN EN LOS ATRIBUTOS EXTENDIDOS. Una copia del volumen que no
  # los conserve (`cp -r`, un tar sin `--xattrs`) los pierde EN SILENCIO: los ficheros llegan
  # enteros y el archivo legal deja de estar bloqueado. `cp -a` sí los conserva.
  #
  # ⚠️ NO LEE UN VOLUMEN DE MINIO. Por eso el volumen es otro (`versity_data`): el `minio_data` de
  # una instalación anterior se queda en disco sin montar, y el almacén arranca vacío.
  #
  # Por qué se dejó MinIO: su edición comunitaria dejó de publicarse —los repositorios
  # desaparecieron de Docker Hub en 2026 y la última imagen es de septiembre de 2025—. Los tres
  # ensayos que llevaron aquí están en `docs/planes/deasy/tareas/F29.P1.T*.md`.
  #
  # La imagen va fijada por digest. `ALMACEN_IMAGE` permite apuntar a otra sin tocar este fichero.
  minio:
    image: ${ALMACEN_IMAGE:-ghcr.io/versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5}
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY: ${MINIO_ROOT_USER}
      ROOT_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      VGW_PORT: ":9000"
      VGW_HEALTH: /_health
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_VERSIONING_DIR: /data/versioning
    # La pasarela no crea sus directorios raíz: se crean antes de cederle el proceso.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/s3 /data/versioning && exec /usr/local/bin/docker-entrypoint.sh"]
    volumes:
      - versity_data:/data

  # Se lanza A MANO, y el perfil es lo que lo hace posible sin que arranque en cada `up`. El
  # comando esta documentado en `docs/07-despliegue/COMANDOS_PROYECTO.md`:
  #
  #   bash scripts/docker-env.sh dev --profile storage-init run --rm minio-bootstrap
  #   bash scripts/stack.sh c --profile storage-init run --rm minio-bootstrap
  #
  # ⚠️ Y por eso mismo NO es la barrera del bucket legal. Como no corre solo, el bucket de
  # archivo puede acabar creandolo el backend por el camino perezoso (`makeBucket(bucket, "")`,
  # SIN bloqueo) -- y el bloqueo solo se puede pedir al CREAR el bucket, asi que eso seria
  # irreversible. Esto lo crea BIEN y se niega si ya existe mal; impedir el camino perezoso es
  # cosa del arranque del backend.
  # El cliente sigue siendo `mc`, y su imagen SÍ es la copia congelada del registro del proyecto
  # (`minio/mc` desapareció de Docker Hub con el servidor). Es un cliente S3 de un solo uso: no
  # escucha en ningún puerto. Cambiarlo por otro es F29.P3.T7.
  minio-bootstrap:
    image: ${MINIO_MC_IMAGE:-ghcr.io/fresvel/deasy-minio-mc:RELEASE.2025-02-21T16-00-46Z}
    profiles:
      - storage-init
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_TEMPLATES_BUCKET: ${MINIO_TEMPLATES_BUCKET}
      MINIO_TEMPLATES_PREFIX: ${MINIO_TEMPLATES_PREFIX}
      MINIO_TEMPLATES_SEEDS_PREFIX: ${MINIO_TEMPLATES_SEEDS_PREFIX}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET}
      MINIO_DOCUMENTS_PREFIX: ${MINIO_DOCUMENTS_PREFIX}
      MINIO_CHAT_BUCKET: ${MINIO_CHAT_BUCKET}
      MINIO_CHAT_PREFIX: ${MINIO_CHAT_PREFIX}
      MINIO_SPOOL_BUCKET: ${MINIO_SPOOL_BUCKET}
      MINIO_SIGNATURES_PREFIX: ${MINIO_SIGNATURES_PREFIX}
      MINIO_USERS_BUCKET: ${MINIO_USERS_BUCKET}
      MINIO_USERS_PREFIX: ${MINIO_USERS_PREFIX}
      MINIO_DOSSIER_BUCKET: ${MINIO_DOSSIER_BUCKET}
      MINIO_DOSSIER_PREFIX: ${MINIO_DOSSIER_PREFIX}
      MINIO_LEGAL_BUCKET: ${MINIO_LEGAL_BUCKET}
      MINIO_LEGAL_DRAFTS_BUCKET: ${MINIO_LEGAL_DRAFTS_BUCKET}
      MINIO_LEGAL_RETENTION_MODE: ${MINIO_LEGAL_RETENTION_MODE}
      MINIO_LEGAL_RETENTION_DAYS: ${MINIO_LEGAL_RETENTION_DAYS}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
      - ./minio/import:/import:ro
    depends_on:
      - minio

  backend:
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: ${BACKEND_PORT}
      ORIGIN1: ${ORIGIN1}
      ORIGIN2: ${ORIGIN2}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: 0
      MINIO_TEMPLATES_BUCKET: ${MINIO_TEMPLATES_BUCKET}
      MINIO_TEMPLATES_PREFIX: ${MINIO_TEMPLATES_PREFIX}
      MINIO_TEMPLATES_SEEDS_PREFIX: ${MINIO_TEMPLATES_SEEDS_PREFIX}
      MINIO_TEMPLATES_USERS_PREFIX: ${MINIO_TEMPLATES_USERS_PREFIX}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET}
      MINIO_DOCUMENTS_PREFIX: ${MINIO_DOCUMENTS_PREFIX}
      MINIO_CHAT_BUCKET: ${MINIO_CHAT_BUCKET}
      MINIO_CHAT_PREFIX: ${MINIO_CHAT_PREFIX}
      MINIO_SPOOL_BUCKET: ${MINIO_SPOOL_BUCKET}
      MINIO_SIGNATURES_PREFIX: ${MINIO_SIGNATURES_PREFIX}
      MINIO_USERS_BUCKET: ${MINIO_USERS_BUCKET}
      MINIO_USERS_PREFIX: ${MINIO_USERS_PREFIX}
      MINIO_DOSSIER_BUCKET: ${MINIO_DOSSIER_BUCKET}
      MINIO_DOSSIER_PREFIX: ${MINIO_DOSSIER_PREFIX}
      MINIO_LEGAL_BUCKET: ${MINIO_LEGAL_BUCKET}
      MINIO_LEGAL_DRAFTS_BUCKET: ${MINIO_LEGAL_DRAFTS_BUCKET}
      MINIO_LEGAL_RETENTION_MODE: ${MINIO_LEGAL_RETENTION_MODE}
      MINIO_LEGAL_RETENTION_DAYS: ${MINIO_LEGAL_RETENTION_DAYS}
      RABBITMQ_HTTP_API: ${RABBITMQ_HTTP_API}
      RABBITMQ_HTTP_USER: ${RABBITMQ_HTTP_USER}
      RABBITMQ_HTTP_PASSWORD: ${RABBITMQ_HTTP_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SIGN_REQUEST_QUEUE: deasy.sign.request
      SIGN_VALIDATE_REQUEST_QUEUE: deasy.sign.validate.request
      SIGN_RESPONSE_QUEUE_PREFIX: deasy.sign.response
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    depends_on:
      - backend

  signer:
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SPOOL_BUCKET: ${MINIO_SPOOL_BUCKET}
      SIGNER_PORT: "4000"
      SIGMAKER_DIR: /opt/sigmaker
      # Ruta propia del servicio (la crea la imagen con dueno appuser y modo 0700). Explicita a
      # proposito: el default historico caia en /tmp, de escritura publica, y ahi se desempaqueta
      # el PKCS#12 ademas de los PDF de entrada, limpio y firmado.
      SIGNER_WORKSPACE_DIR: /var/lib/deasy-signer/workspace
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SIGN_REQUEST_QUEUE: deasy.sign.request
      SIGN_VALIDATE_REQUEST_QUEUE: deasy.sign.validate.request
      PYHANKO_TSA_URL: ${PYHANKO_TSA_URL:-}
      SIGNER_EMBED_VALIDATION_INFO: ${SIGNER_EMBED_VALIDATION_INFO:-1}
      SIGNER_USE_PADES_LTA: ${SIGNER_USE_PADES_LTA:-0}
      SIGNER_USE_GHOSTSCRIPT: ${SIGNER_USE_GHOSTSCRIPT:-1}
    depends_on:
      - minio
      - rabbitmq

  analytics:
    restart: unless-stopped
    profiles:
      - workers

volumes:
  postgres_data:
  rabbitmq_data:
  versity_data:
  backend_node_modules_v2:
  frontend_node_modules:

services:
  # Único motor de datos (migración a PostgreSQL completa; MariaDB y Mongo retirados).
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      # OJO: RabbitMQ solo honra estas dos variables en el PRIMER arranque, con el volumen de
      # datos vacio. En un despliegue que ya existe hay que crear el usuario a mano una vez:
      # ver scripts/rabbitmq-migrar-usuario.sh
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    profiles:
      - storage-init
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_TEMPLATES_BUCKET: ${MINIO_TEMPLATES_BUCKET}
      MINIO_TEMPLATES_PREFIX: ${MINIO_TEMPLATES_PREFIX}
      MINIO_TEMPLATES_SEEDS_PREFIX: ${MINIO_TEMPLATES_SEEDS_PREFIX}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET}
      MINIO_DOCUMENTS_PREFIX: ${MINIO_DOCUMENTS_PREFIX}
      MINIO_CHAT_BUCKET: ${MINIO_CHAT_BUCKET}
      MINIO_CHAT_PREFIX: ${MINIO_CHAT_PREFIX}
      MINIO_SPOOL_BUCKET: ${MINIO_SPOOL_BUCKET}
      MINIO_SIGNATURES_PREFIX: ${MINIO_SIGNATURES_PREFIX}
      MINIO_USERS_BUCKET: ${MINIO_USERS_BUCKET}
      MINIO_USERS_PREFIX: ${MINIO_USERS_PREFIX}
      MINIO_DOSSIER_BUCKET: ${MINIO_DOSSIER_BUCKET}
      MINIO_DOSSIER_PREFIX: ${MINIO_DOSSIER_PREFIX}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
      - ./minio/import:/import:ro
    depends_on:
      - minio

  backend:
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: ${BACKEND_PORT}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: 0
      MINIO_TEMPLATES_BUCKET: ${MINIO_TEMPLATES_BUCKET}
      MINIO_TEMPLATES_PREFIX: ${MINIO_TEMPLATES_PREFIX}
      MINIO_TEMPLATES_SEEDS_PREFIX: ${MINIO_TEMPLATES_SEEDS_PREFIX}
      MINIO_TEMPLATES_USERS_PREFIX: ${MINIO_TEMPLATES_USERS_PREFIX}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET}
      MINIO_DOCUMENTS_PREFIX: ${MINIO_DOCUMENTS_PREFIX}
      MINIO_CHAT_BUCKET: ${MINIO_CHAT_BUCKET}
      MINIO_CHAT_PREFIX: ${MINIO_CHAT_PREFIX}
      MINIO_SPOOL_BUCKET: ${MINIO_SPOOL_BUCKET}
      MINIO_SIGNATURES_PREFIX: ${MINIO_SIGNATURES_PREFIX}
      MINIO_USERS_BUCKET: ${MINIO_USERS_BUCKET}
      MINIO_USERS_PREFIX: ${MINIO_USERS_PREFIX}
      MINIO_DOSSIER_BUCKET: ${MINIO_DOSSIER_BUCKET}
      MINIO_DOSSIER_PREFIX: ${MINIO_DOSSIER_PREFIX}
      RABBITMQ_HTTP_API: ${RABBITMQ_HTTP_API}
      RABBITMQ_HTTP_USER: ${RABBITMQ_HTTP_USER}
      RABBITMQ_HTTP_PASSWORD: ${RABBITMQ_HTTP_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SIGN_REQUEST_QUEUE: deasy.sign.request
      SIGN_VALIDATE_REQUEST_QUEUE: deasy.sign.validate.request
      SIGN_RESPONSE_QUEUE_PREFIX: deasy.sign.response
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    depends_on:
      - backend

  signer:
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SPOOL_BUCKET: ${MINIO_SPOOL_BUCKET}
      SIGNER_PORT: "4000"
      SIGMAKER_DIR: /opt/sigmaker
      # Ruta propia del servicio (la crea la imagen con dueno appuser y modo 0700). Explicita a
      # proposito: el default historico caia en /tmp, de escritura publica, y ahi se desempaqueta
      # el PKCS#12 ademas de los PDF de entrada, limpio y firmado.
      SIGNER_WORKSPACE_DIR: /var/lib/deasy-signer/workspace
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SIGN_REQUEST_QUEUE: deasy.sign.request
      SIGN_VALIDATE_REQUEST_QUEUE: deasy.sign.validate.request
      PYHANKO_TSA_URL: ${PYHANKO_TSA_URL:-}
      SIGNER_EMBED_VALIDATION_INFO: ${SIGNER_EMBED_VALIDATION_INFO:-1}
      SIGNER_USE_PADES_LTA: ${SIGNER_USE_PADES_LTA:-0}
      SIGNER_USE_GHOSTSCRIPT: ${SIGNER_USE_GHOSTSCRIPT:-1}
    depends_on:
      - minio
      - rabbitmq

  analytics:
    restart: unless-stopped
    profiles:
      - workers

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  backend_node_modules_v2:
  frontend_node_modules:

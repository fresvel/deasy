services:
  # Único motor de datos (migración a PostgreSQL completa; MariaDB y Mongo retirados).
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      # OJO: RabbitMQ solo honra estas dos variables en el PRIMER arranque, con el volumen de
      # datos vacio. En un despliegue que ya existe hay que crear el usuario a mano una vez:
      # ver scripts/rabbitmq-migrar-usuario.sh
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # EL ALMACÉN ES VERSITY GATEWAY DESDE EL 2026-11-25 (frente 29). El servicio se llamaba `minio`
  # y sus variables `MINIO_*`; se renombraron ese día a `almacen` y `ALMACEN_*`, y el backend y el
  # firmador CORTAN EL ARRANQUE si el entorno trae una con el prefijo viejo. Lo que la aplicación
  # habla con él es S3. Lo que corre es una pasarela S3 (Apache 2.0) sobre un directorio:
  #   /data/s3          los objetos, como ficheros corrientes (metadatos en xattrs `user.*`)
  #   /data/versioning  las versiones NO vigentes (sin esto no hay versionado ni Object Lock)
  # Los dos van en UN volumen a propósito: pasar una versión de un árbol a otro es un rename.
  #
  # ⚠️ EL BLOQUEO Y LAS VERSIONES VIVEN EN LOS ATRIBUTOS EXTENDIDOS. Una copia del volumen que no
  # los conserve (`cp -r`, un tar sin `--xattrs`) los pierde EN SILENCIO: los ficheros llegan
  # enteros y el archivo legal deja de estar bloqueado. `cp -a` sí los conserva.
  #
  # ⚠️ NO LEE UN VOLUMEN DE MINIO. Por eso el volumen es otro (`versity_data`): el `minio_data` de
  # una instalación anterior se queda en disco sin montar, y el almacén arranca vacío.
  #
  # Por qué se dejó MinIO: su edición comunitaria dejó de publicarse —los repositorios
  # desaparecieron de Docker Hub en 2026 y la última imagen es de septiembre de 2025—. Los tres
  # ensayos que llevaron aquí están en `docs/planes/deasy/tareas/F29.P1.T*.md`.
  #
  # La imagen va fijada por digest. `ALMACEN_IMAGE` permite apuntar a otra sin tocar este fichero.
  almacen:
    image: ${ALMACEN_IMAGE:-ghcr.io/versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5}
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY: ${ALMACEN_ROOT_USER:?falta ALMACEN_ROOT_USER (hasta el 2026-11-25 se llamaba MINIO_ROOT_USER)}
      ROOT_SECRET_KEY: ${ALMACEN_ROOT_PASSWORD:?falta ALMACEN_ROOT_PASSWORD (hasta el 2026-11-25 se llamaba MINIO_ROOT_PASSWORD)}
      VGW_PORT: ":9000"
      VGW_HEALTH: /_health
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_VERSIONING_DIR: /data/versioning
    # La pasarela no crea sus directorios raíz: se crean antes de cederle el proceso.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/s3 /data/versioning && exec /usr/local/bin/docker-entrypoint.sh"]
    volumes:
      - versity_data:/data

  # AQUÍ HUBO UN SERVICIO `almacen-bootstrap` (perfil `storage-init`), que con el cliente `mc`
  # creaba los buckets y subía carpetas de importación. Se retiró el 2026-11-25 (F29.P3.T7): los
  # buckets —el legal, con su bloqueo— los crea el backend al arrancar, los textos legales los
  # precarga la instalación como borrador, y su imagen era una copia privada sin mantenimiento que
  # el servidor de qa no podía descargar.

  backend:
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: ${BACKEND_PORT}
      ORIGIN1: ${ORIGIN1}
      ORIGIN2: ${ORIGIN2}
      ALMACEN_ENDPOINT: http://almacen:9000
      ALMACEN_PUBLIC_ENDPOINT: http://localhost:${ALMACEN_API_PORT}
      ALMACEN_ACCESS_KEY: ${ALMACEN_ROOT_USER}
      ALMACEN_SECRET_KEY: ${ALMACEN_ROOT_PASSWORD}
      ALMACEN_USE_SSL: 0
      ALMACEN_TEMPLATES_BUCKET: ${ALMACEN_TEMPLATES_BUCKET}
      ALMACEN_TEMPLATES_PREFIX: ${ALMACEN_TEMPLATES_PREFIX}
      ALMACEN_TEMPLATES_SEEDS_PREFIX: ${ALMACEN_TEMPLATES_SEEDS_PREFIX}
      ALMACEN_TEMPLATES_USERS_PREFIX: ${ALMACEN_TEMPLATES_USERS_PREFIX}
      ALMACEN_DOCUMENTS_BUCKET: ${ALMACEN_DOCUMENTS_BUCKET}
      ALMACEN_DOCUMENTS_PREFIX: ${ALMACEN_DOCUMENTS_PREFIX}
      ALMACEN_CHAT_BUCKET: ${ALMACEN_CHAT_BUCKET}
      ALMACEN_CHAT_PREFIX: ${ALMACEN_CHAT_PREFIX}
      ALMACEN_SPOOL_BUCKET: ${ALMACEN_SPOOL_BUCKET}
      ALMACEN_SIGNATURES_PREFIX: ${ALMACEN_SIGNATURES_PREFIX}
      ALMACEN_USERS_BUCKET: ${ALMACEN_USERS_BUCKET}
      ALMACEN_USERS_PREFIX: ${ALMACEN_USERS_PREFIX}
      ALMACEN_DOSSIER_BUCKET: ${ALMACEN_DOSSIER_BUCKET}
      ALMACEN_DOSSIER_PREFIX: ${ALMACEN_DOSSIER_PREFIX}
      ALMACEN_LEGAL_BUCKET: ${ALMACEN_LEGAL_BUCKET}
      ALMACEN_LEGAL_DRAFTS_BUCKET: ${ALMACEN_LEGAL_DRAFTS_BUCKET}
      ALMACEN_LEGAL_RETENTION_MODE: ${ALMACEN_LEGAL_RETENTION_MODE}
      ALMACEN_LEGAL_RETENTION_DAYS: ${ALMACEN_LEGAL_RETENTION_DAYS}
      RABBITMQ_HTTP_API: ${RABBITMQ_HTTP_API}
      RABBITMQ_HTTP_USER: ${RABBITMQ_HTTP_USER}
      RABBITMQ_HTTP_PASSWORD: ${RABBITMQ_HTTP_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SIGN_REQUEST_QUEUE: deasy.sign.request
      SIGN_VALIDATE_REQUEST_QUEUE: deasy.sign.validate.request
      SIGN_RESPONSE_QUEUE_PREFIX: deasy.sign.response
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    depends_on:
      - backend

  signer:
    restart: unless-stopped
    environment:
      ALMACEN_ENDPOINT: http://almacen:9000
      ALMACEN_ACCESS_KEY: ${ALMACEN_ROOT_USER}
      ALMACEN_SECRET_KEY: ${ALMACEN_ROOT_PASSWORD}
      ALMACEN_SPOOL_BUCKET: ${ALMACEN_SPOOL_BUCKET}
      SIGNER_PORT: "4000"
      SIGMAKER_DIR: /opt/sigmaker
      # Ruta propia del servicio (la crea la imagen con dueno appuser y modo 0700). Explicita a
      # proposito: el default historico caia en /tmp, de escritura publica, y ahi se desempaqueta
      # el PKCS#12 ademas de los PDF de entrada, limpio y firmado.
      SIGNER_WORKSPACE_DIR: /var/lib/deasy-signer/workspace
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SIGN_REQUEST_QUEUE: deasy.sign.request
      SIGN_VALIDATE_REQUEST_QUEUE: deasy.sign.validate.request
      PYHANKO_TSA_URL: ${PYHANKO_TSA_URL:-}
      SIGNER_EMBED_VALIDATION_INFO: ${SIGNER_EMBED_VALIDATION_INFO:-1}
      SIGNER_USE_PADES_LTA: ${SIGNER_USE_PADES_LTA:-0}
      SIGNER_USE_GHOSTSCRIPT: ${SIGNER_USE_GHOSTSCRIPT:-1}
    depends_on:
      - almacen
      - rabbitmq

  analytics:
    restart: unless-stopped
    profiles:
      - workers

volumes:
  postgres_data:
  rabbitmq_data:
  versity_data:
  backend_node_modules_v2:
  frontend_node_modules:

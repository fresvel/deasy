name: deasy-qa

x-runtime-env-file: &qa_runtime_env_file
  - ${DEASY_CONTAINER_ENV_FILE:-.env.qa}

# ⚠️ LOS PUERTOS DE LA BASE, DEL ALMACÉN Y DEL FIRMADOR SE PUBLICAN SÓLO EN `127.0.0.1` (2026-11-24).
# Se publicaban en todas las interfaces, o sea hacia internet si el cortafuegos del servidor no los
# cerraba: PostgreSQL, la API del almacén y el firmador. Ninguno tiene por qué recibir
# tráfico de fuera —el backend les habla por la red de contenedores, y lo público entra por el
# proxy—. Siguen alcanzables DESDE el servidor, que es para lo que sirven: `psql` local, o un túnel
# de SSH para hablarle al almacén con un cliente S3 (`ssh -L 9100:127.0.0.1:9100 …`).
#
# El almacén es Versity Gateway desde el 2026-11-25 (ver `compose.base.yml`). No publica consola
# web: la de MinIO, en el 9001, se fue con él.
services:
  postgres:
    env_file: *qa_runtime_env_file
    ports:
      - "127.0.0.1:15432:5432"

  rabbitmq:
    env_file: *qa_runtime_env_file
    # SIN `ports`: el broker solo se alcanza por la red interna de compose. Backend y signer usan
    # `rabbitmq:5672` y `http://rabbitmq:15672/api`, asi que publicarlo al host no daba servicio a
    # nadie: solo exponia la UI de gestion, que permite leer el cuerpo de los mensajes.

  almacen:
    env_file: *qa_runtime_env_file
    ports:
      - "127.0.0.1:${ALMACEN_API_PORT}:9000"

  almacen-bootstrap:
    env_file: *qa_runtime_env_file

  backend:
    image: ${IMAGE_REGISTRY}/${BACKEND_IMAGE_REPOSITORY}:${BACKEND_IMAGE_TAG}
    pull_policy: always
    env_file: *qa_runtime_env_file
    networks:
      default: {}
      public-ingress:
        aliases:
          - deasy-qa-backend

  frontend:
    image: ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:${FRONTEND_IMAGE_TAG}
    pull_policy: always
    env_file: *qa_runtime_env_file
    networks:
      default: {}
      public-ingress:
        aliases:
          - deasy-qa-frontend

  signer:
    image: ${IMAGE_REGISTRY}/${SIGNER_IMAGE_REPOSITORY}:${SIGNER_IMAGE_TAG}
    pull_policy: always
    env_file: *qa_runtime_env_file
    ports:
      - "127.0.0.1:14000:4000"

  analytics:
    image: ${IMAGE_REGISTRY}/${ANALYTICS_IMAGE_REPOSITORY}:${ANALYTICS_IMAGE_TAG}
    pull_policy: always
    env_file: *qa_runtime_env_file

volumes:
  postgres_data:
    name: deasy_qa_postgres_data
  rabbitmq_data:
    name: deasy_qa_rabbitmq_data
  # El almacén es Versity Gateway y NO lee un volumen de MinIO: usa el suyo. Si en el servidor
  # queda un `deasy_qa_minio_data` de antes, ya no lo monta nadie.
  versity_data:
    name: deasy_qa_versity_data
  backend_node_modules_v2:
    name: deasy_qa_backend_node_modules
  frontend_node_modules:
    name: deasy_qa_frontend_node_modules

networks:
  default:
    name: deasy_qa_network
  public-ingress:
    name: ${PUBLIC_INGRESS_NETWORK:-deasy_public_ingress}
    external: true

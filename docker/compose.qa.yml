name: deasy-qa

x-runtime-env-file: &qa_runtime_env_file
  - ${DEASY_CONTAINER_ENV_FILE:-.env.qa}

services:
  postgres:
    env_file: *qa_runtime_env_file
    ports:
      - "15432:5432"

  rabbitmq:
    env_file: *qa_runtime_env_file
    # SIN `ports`: el broker solo se alcanza por la red interna de compose. Backend y signer usan
    # `rabbitmq:5672` y `http://rabbitmq:15672/api`, asi que publicarlo al host no daba servicio a
    # nadie: solo exponia la UI de gestion, que permite leer el cuerpo de los mensajes.

  minio:
    env_file: *qa_runtime_env_file
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

  minio-bootstrap:
    env_file: *qa_runtime_env_file

  backend:
    image: ${IMAGE_REGISTRY}/${BACKEND_IMAGE_REPOSITORY}:${BACKEND_IMAGE_TAG}
    pull_policy: always
    env_file: *qa_runtime_env_file
    networks:
      default: {}
      public-ingress:
        aliases:
          - deasy-qa-backend

  frontend:
    image: ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:${FRONTEND_IMAGE_TAG}
    pull_policy: always
    env_file: *qa_runtime_env_file
    networks:
      default: {}
      public-ingress:
        aliases:
          - deasy-qa-frontend

  signer:
    image: ${IMAGE_REGISTRY}/${SIGNER_IMAGE_REPOSITORY}:${SIGNER_IMAGE_TAG}
    pull_policy: always
    env_file: *qa_runtime_env_file
    ports:
      - "14000:4000"

  analytics:
    image: ${IMAGE_REGISTRY}/${ANALYTICS_IMAGE_REPOSITORY}:${ANALYTICS_IMAGE_TAG}
    pull_policy: always
    env_file: *qa_runtime_env_file

volumes:
  postgres_data:
    name: deasy_qa_postgres_data
  rabbitmq_data:
    name: deasy_qa_rabbitmq_data
  minio_data:
    name: deasy_qa_minio_data
  backend_node_modules_v2:
    name: deasy_qa_backend_node_modules
  frontend_node_modules:
    name: deasy_qa_frontend_node_modules

networks:
  default:
    name: deasy_qa_network
  public-ingress:
    name: ${PUBLIC_INGRESS_NETWORK:-deasy_public_ingress}
    external: true

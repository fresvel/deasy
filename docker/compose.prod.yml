name: deasy-prod

x-runtime-env-file: &prod_runtime_env_file
  - ${DEASY_CONTAINER_ENV_FILE:-.env.prod}

# ⚠️ LOS PUERTOS DE LA BASE, DEL ALMACÉN Y DEL FIRMADOR SE PUBLICAN SÓLO EN `127.0.0.1` (2026-11-24).
# Se publicaban en todas las interfaces, o sea hacia internet si el cortafuegos del servidor no los
# cerraba: PostgreSQL, la API del almacén y el firmador. Ninguno tiene por qué recibir
# tráfico de fuera —el backend les habla por la red de contenedores, y lo público entra por el
# proxy—. Siguen alcanzables DESDE el servidor, que es para lo que sirven: `psql` local, o un túnel
# de SSH para hablarle al almacén con un cliente S3 (`ssh -L 9200:127.0.0.1:9200 …`).
#
# El almacén es Versity Gateway desde el 2026-11-25 (ver `compose.base.yml`). No publica consola
# web: la de MinIO, en el 9001, se fue con él.
services:
  postgres:
    env_file: *prod_runtime_env_file
    restart: always
    ports:
      - "127.0.0.1:25432:5432"

  rabbitmq:
    env_file: *prod_runtime_env_file
    restart: always
    # SIN `ports`: el broker solo se alcanza por la red interna de compose. Backend y signer usan
    # `rabbitmq:5672` y `http://rabbitmq:15672/api`, asi que publicarlo al host no daba servicio a
    # nadie: solo exponia la UI de gestion, que permite leer el cuerpo de los mensajes, y ahi viaja
    # la contrasena del PKCS#12 (`certPassword`).

  almacen:
    env_file: *prod_runtime_env_file
    restart: always
    ports:
      - "127.0.0.1:${ALMACEN_API_PORT}:9000"

  almacen-bootstrap:
    env_file: *prod_runtime_env_file

  backend:
    image: ${IMAGE_REGISTRY}/${BACKEND_IMAGE_REPOSITORY}:${BACKEND_IMAGE_TAG}
    pull_policy: always
    env_file: *prod_runtime_env_file
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      default: {}
      public-ingress:
        aliases:
          - deasy-prod-backend

  frontend:
    image: ${IMAGE_REGISTRY}/${FRONTEND_IMAGE_REPOSITORY}:${FRONTEND_IMAGE_TAG}
    pull_policy: always
    env_file: *prod_runtime_env_file
    restart: always
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default: {}
      public-ingress:
        aliases:
          - deasy-prod-frontend

  signer:
    image: ${IMAGE_REGISTRY}/${SIGNER_IMAGE_REPOSITORY}:${SIGNER_IMAGE_TAG}
    pull_policy: always
    env_file: *prod_runtime_env_file
    restart: always
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:24000:4000"

  analytics:
    image: ${IMAGE_REGISTRY}/${ANALYTICS_IMAGE_REPOSITORY}:${ANALYTICS_IMAGE_TAG}
    pull_policy: always
    env_file: *prod_runtime_env_file
    restart: always
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: deasy_prod_postgres_data
  rabbitmq_data:
    name: deasy_prod_rabbitmq_data
  # El almacén es Versity Gateway y NO lee un volumen de MinIO: usa el suyo. Si en el servidor
  # queda un `deasy_prod_minio_data` de antes, ya no lo monta nadie.
  versity_data:
    name: deasy_prod_versity_data
  backend_node_modules_v2:
    name: deasy_prod_backend_node_modules
  frontend_node_modules:
    name: deasy_prod_frontend_node_modules

networks:
  default:
    name: deasy_prod_network
  public-ingress:
    name: ${PUBLIC_INGRESS_NETWORK:-deasy_public_ingress}
    external: true

# Se retira `loopback_users.guest = false`, que estaba aqui y desactivaba la proteccion por
# defecto de RabbitMQ: con ella desactivada, el usuario `guest` —que ademas tiene rol de
# administrador— podia conectarse desde CUALQUIER interfaz. Combinado con los puertos que se
# publicaban al host, eso dejaba la UI de gestion al alcance de la red; y esa UI muestra el
# CUERPO de los mensajes, donde viaja `certPassword` (la clave del PKCS#12 del firmante).
#
# Ahora el sistema NO usa `guest`: backend y signer se autentican con RABBITMQ_USER /
# RABBITMQ_PASSWORD, y el broker solo se alcanza por la red interna de compose.
#
# Con este fichero en su forma minima, `guest` vuelve a su restriccion nativa: solo loopback.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }


  # ── LA RED GRUESA DEL LIMITADOR (C9) ───────────────────────────────────────────────────────────
  #
  # Esto NO es el control de seguridad: el que decide es el del backend, que sabe de cuentas y
  # distingue un acceso fallido de uno correcto. Esta capa existe por un motivo distinto y concreto:
  # el contador del backend vive en PostgreSQL, asi que una inundacion contra /api/ convertiria CADA
  # peticion en una consulta -- y entonces el limitador seria el ataque. nginx corta el volumen antes
  # de que Node lea nada.
  #
  # ⚠️ GENEROSO A PROPOSITO. Una universidad sale a internet POR NAT: detras de esta IP puede estar
  # el campus entero. Un numero bajo aqui no frena a un atacante, deja fuera a una facultad.
  #
  # 10 MB de zona guardan del orden de 160 000 IPs. `nodelay` deja pasar la rafaga de golpe en vez de
  # espaciarla: navegar una pantalla son muchas peticiones a la vez, y espaciarlas se notaria como
  # lentitud.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}

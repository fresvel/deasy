sonar.projectKey=deasy
sonar.projectName=Deasy (PUCESE)
# OJO: no toques projectVersion sin querer. El New Code period esta en PREVIOUS_VERSION,
# asi que bumpearlo mueve la ventana de "codigo nuevo" y tira la serie historica de
# docs/plan-calidad-2026-08.md §2, que es el unico termometro fiable del proyecto.
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# --- Codigo de produccion -----------------------------------------------------------
# sonar.sources y sonar.tests apuntan a las MISMAS carpetas a proposito: los tests
# unitarios viven junto al modulo que prueban (ver CLAUDE.md). SonarQube lo admite
# siempre que los patrones de inclusion/exclusion produzcan conjuntos DISJUNTOS; si se
# solapan, el escaner aborta con "File can't be indexed twice".
sonar.sources=backend,frontend/src,signer,scripts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/venv/**,**/public/**,**/*.min.js,docs/**,**/pnpm-lock.yaml,**/package-lock.json,backend/services/system/seeds/**,**/coverage/**,**/*.test.js,**/*.test.mjs,**/*.spec.js,**/*.spec.mjs,backend/tests/**,signer/tests/**

# --- Codigo de prueba ---------------------------------------------------------------
# Exactamente el complemento de las dos ultimas lineas de sonar.exclusions.
# Sin esto, las contrasenas de fixture de backend/tests/characterization/config.mjs
# cuentan como vulnerabilidades de PRODUCCION (era el hueco H1 del plan de calidad).
#
# `signer/tests/**` va aparte porque en Python NO valen los sufijos `*.test.js`: cualquier
# fichero .py bajo `signer/` se indexa como produccion salvo que se excluya por ruta. Sin esta
# linea, las contrasenas y los certificados sinteticos de la red del signer contarian como
# vulnerabilidades del sistema (es el mismo hueco H1 que se cerro con backend/tests).
sonar.tests=backend,frontend/src,signer/tests
sonar.test.inclusions=**/*.test.js,**/*.test.mjs,**/*.spec.js,**/*.spec.mjs,backend/tests/**,signer/tests/**
sonar.test.exclusions=**/node_modules/**,**/coverage/**

# --- Cobertura ----------------------------------------------------------------------
# LOS TRES informes se REGENERAN ANTES DE CADA ESCANEO, o Sonar lee los de la corrida
# anterior sin quejarse:
#   docker-env.sh dev exec -T backend  npm run test:unit:coverage
#   docker-env.sh dev exec -T frontend pnpm run test:unit:coverage
#   bash scripts/signer-coverage.sh
# Los tres emiten rutas relativas a la RAIZ DEL REPO. Si algun dia salen relativas al
# modulo, Sonar las descarta EN SILENCIO y la cobertura de esa zona vuelve a 0.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Python: sin esta linea, las 229 pruebas de signer/tests/ no cuentan y `signer/app.py`
# figura al 0,0 % estando en realidad al 88 %. Es el fallo silencioso mas caro que ha
# tenido este proyecto: el fichero mas complejo del repo parecia no tener ni una prueba.
sonar.python.coverage.reportPaths=signer/coverage/coverage.xml

sonar.javascript.exclusions=**/node_modules/**

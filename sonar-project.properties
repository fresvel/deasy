sonar.projectKey=deasy
sonar.projectName=Deasy (PUCESE)
# OJO: no toques projectVersion sin querer. El New Code period esta en PREVIOUS_VERSION,
# asi que bumpearlo mueve la ventana de "codigo nuevo" y tira la serie historica de
# docs/plan-calidad-2026-08.md §2, que es el unico termometro fiable del proyecto.
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# --- Codigo de produccion -----------------------------------------------------------
# sonar.sources y sonar.tests apuntan a las MISMAS carpetas a proposito: los tests
# unitarios viven junto al modulo que prueban (ver CLAUDE.md). SonarQube lo admite
# siempre que los patrones de inclusion/exclusion produzcan conjuntos DISJUNTOS; si se
# solapan, el escaner aborta con "File can't be indexed twice".
sonar.sources=backend,frontend/src,signer,scripts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/venv/**,**/public/**,**/*.min.js,docs/**,**/pnpm-lock.yaml,**/package-lock.json,backend/services/system/seeds/**,**/coverage/**,**/*.test.js,**/*.test.mjs,**/*.spec.js,**/*.spec.mjs,backend/tests/**,signer/tests/**

# --- Codigo de prueba ---------------------------------------------------------------
# Exactamente el complemento de las dos ultimas lineas de sonar.exclusions.
# Sin esto, las contrasenas de fixture de backend/tests/characterization/config.mjs
# cuentan como vulnerabilidades de PRODUCCION (era el hueco H1 del plan de calidad).
#
# `signer/tests/**` va aparte porque en Python NO valen los sufijos `*.test.js`: cualquier
# fichero .py bajo `signer/` se indexa como produccion salvo que se excluya por ruta. Sin esta
# linea, las contrasenas y los certificados sinteticos de la red del signer contarian como
# vulnerabilidades del sistema (es el mismo hueco H1 que se cerro con backend/tests).
sonar.tests=backend,frontend/src,signer/tests
sonar.test.inclusions=**/*.test.js,**/*.test.mjs,**/*.spec.js,**/*.spec.mjs,backend/tests/**,signer/tests/**
sonar.test.exclusions=**/node_modules/**,**/coverage/**

# --- Cobertura ----------------------------------------------------------------------
# LOS TRES informes se REGENERAN ANTES DE CADA ESCANEO, o Sonar lee los de la corrida
# anterior sin quejarse:
#   docker-env.sh dev exec -T backend  npm run test:unit:coverage
#   docker-env.sh dev exec -T frontend pnpm run test:unit:coverage
#   bash scripts/signer-coverage.sh
# Los tres emiten rutas relativas a la RAIZ DEL REPO. Si algun dia salen relativas al
# modulo, Sonar las descarta EN SILENCIO y la cobertura de esa zona vuelve a 0.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Python: sin esta linea, las 266 pruebas de signer/tests/ no cuentan y `signer/app.py`
# figura al 0,0 % estando en realidad al 89 %. Es el fallo silencioso mas caro que ha
# tenido este proyecto: el fichero mas complejo del repo parecia no tener ni una prueba.
sonar.python.coverage.reportPaths=signer/coverage/coverage.xml

sonar.javascript.exclusions=**/node_modules/**

# --- Reglas excluidas, CON SU MOTIVO -----------------------------------------------
# ⛔ `S1135` («Track uses of "TODO" tags») NO PUEDE ACERTAR EN ESTE REPOSITORIO, y por eso se
# excluye aqui en vez de desactivarse en el perfil del servidor.
#
# POR QUE SE EXCLUYE. La regla busca una sola cosa: la palabra `TODO` dentro de un comentario. Y
# aqui se documenta EN CASTELLANO, donde «todo» es una palabra corriente: hay 349 lineas con ella.
# Medido el 2026-10-09: **123 incidencias** (108 javascript + 14 Web + 1 python) y **ni una es un
# marcador de tarea**. Sondeadas una a una:
#
#     «todo lo que aparece en un `main:`»        «Todo dentro de la MISMA transaccion»
#     «todo `INSERT` en `turnos` la lleva»       «direccion unica en todo el sistema»
#     «Todo lo que sigue responde a la misma pregunta»   (signer/app.py:326)
#
# Y 32 estan en MAYUSCULAS, que tampoco son marcadores: es el estilo de este repositorio, que GRITA
# palabras para enfatizar --«dejaria sin servicio TODO», «reescribe TODO el SQL», «TODO MENOS LO
# SENSIBLE», «contaria a TODO EL MUNDO»--. Mientras se documente asi, la regla disparara siempre:
# no es un pico, es permanente.
#
# QUE NO SE PIERDE, y es lo que hace aceptable excluirla. `FIXME` es OTRA regla --`S1134`, y de
# severidad MAJOR, no INFO-- que sigue activa. Asi que un pendiente real se sigue cazando, y encima
# PESA MAS que antes. La convencion del repositorio pasa a ser **marcar lo pendiente con `FIXME`**
# (esta en el `CLAUDE.md` de la raiz). Comprobado el 2026-10-09: hoy no hay ni un `FIXME`, asi que
# esto no tapa nada existente.
#
# POR QUE AQUI Y NO EN EL PERFIL DE CALIDAD. Las dos cosas funcionan, pero el perfil vive en la base
# de datos del servidor --un volumen de Docker-- y no viaja con el codigo: un `docker volume rm` se
# lo lleva y nadie se enteraria. Esto esta en git, se ve en el diff de quien lo cambie, y el motivo
# vive al lado. El mismo dia se encontro una marca puesta como `WONTFIX` **sin un solo comentario**,
# que es exactamente el problema que esta decision evita.
#
# ⚠️ `S1135` NO TIENE PARAMETROS: no se le puede enseñar a ignorar el castellano. O se excluye o se
# marcan las 123 a mano, y la segunda opcion crece con cada comentario que alguien escriba.
# ⚠️ Y pesa CERO minutos de deuda y es de severidad INFO, asi que esto NO mueve ninguna nota. Lo
# unico que cambia es el recuento --y `new_violations`, que la puerta de calidad mira con `> 0`.
sonar.issue.ignore.multicriteria=todoEs
sonar.issue.ignore.multicriteria.todoEs.ruleKey=*:S1135
sonar.issue.ignore.multicriteria.todoEs.resourceKey=**/*
